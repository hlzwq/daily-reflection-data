const dateMap = new Map();
reflections.forEach(r => dateMap.set(r.date, r));

const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

let currentDate = reflections.length > 0 ? reflections[reflections.length - 1].date : null;
let calendarYear = 2026;
let calendarMonth = 7;

// Touch handling for swipe
let touchStartX = 0;
let touchStartY = 0;
let touchEndX = 0;
let touchEndY = 0;

function formatDate(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return { year: y, month: m, day: d };
}

function getDateString(year, month, day) {
  return `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}

function updateDisplay() {
  if (!currentDate) return;
  const { year, month, day } = formatDate(currentDate);
  const date = new Date(year, month - 1, day);
  
  // Update header
  document.getElementById('headerTitle').textContent = `${year}.${String(month).padStart(2,'0')}.${String(day).padStart(2,'0')}`;
  document.getElementById('headerSubtitle').textContent = weekdays[date.getDay()];
  
  // Update date hero
  document.getElementById('dayNumber').textContent = day;
  document.getElementById('monthYear').textContent = `${year}年${monthNames[month-1]}`;
  document.getElementById('weekdayBadge').textContent = weekdays[date.getDay()];
  
  // Update stats
  const totalReflections = reflections.length;
  const currentIdx = reflections.findIndex(r => r.date === currentDate);
  document.getElementById('totalCount').textContent = totalReflections;
  document.getElementById('currentIndex').textContent = currentIdx >= 0 ? `#${currentIdx + 1}` : '--';
  
  // Calculate streak
  let streak = 0;
  for (let i = reflections.length - 1; i >= 0; i--) {
    const d = new Date(reflections[i].date);
    const expected = new Date();
    expected.setDate(expected.getDate() - (reflections.length - 1 - i));
    if (d.toDateString() === expected.toDateString() || i === reflections.length - 1) {
      streak++;
    } else {
      break;
    }
  }
  document.getElementById('currentStreak').textContent = streak;
  
  // Update reflection content
  const reflection = dateMap.get(currentDate);
  const card = document.getElementById('reflectionCard');
  const summaryCard = document.getElementById('summaryCard');
  const emptyState = document.getElementById('emptyState');
  
  if (reflection) {
    card.style.display = 'block';
    summaryCard.style.display = 'block';
    emptyState.style.display = 'none';
    
    // Summary
    document.getElementById('summaryText').textContent = reflection.summary || '暂无摘要';
    
    // Tags
    const tagsRow = document.getElementById('tagsRow');
    tagsRow.innerHTML = '';
    if (reflection.tags && reflection.tags.length > 0) {
      reflection.tags.forEach(tag => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.textContent = tag;
        tagsRow.appendChild(span);
      });
    }
    
    // Content
    document.getElementById('cardContent').innerHTML = renderMarkdown(reflection.content);
    
    // Progress badge
    const progress = currentIdx >= 0 ? Math.round(((currentIdx + 1) / totalReflections) * 100) : 0;
    document.getElementById('progressBadge').textContent = `${progress}%`;
    
  } else {
    card.style.display = 'none';
    summaryCard.style.display = 'none';
    emptyState.style.display = 'block';
  }
  
  // Update nav buttons
  document.getElementById('prevBtn').disabled = currentIdx <= 0;
  document.getElementById('nextBtn').disabled = currentIdx >= reflections.length - 1;
  
  // Update calendar if open
  if (document.getElementById('modal').classList.contains('active')) {
    renderCalendar();
  }
}

function renderMarkdown(md) {
  let html = md;
  
  // Code blocks
  html = html.replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  
  // Headers
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  
  // Tables
  html = html.replace(/^\|(.+)\|$/gm, function(match) {
    const cells = match.split('|').filter(c => c.trim() && !/^[-:]+$/.test(c.trim()));
    if (cells.length === 0) return '';
    return '<tr>' + cells.map(c => `<td>${c.trim()}</td>`).join('') + '</tr>';
  });
  html = html.replace(/((<tr>.*</tr>\n?)+)/g, '<table>$1</table>');
  
  // Blockquotes
  html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
  
  // Horizontal rules
  html = html.replace(/^---$/gm, '<hr>');
  
  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  
  // Italic
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  
  // Unordered lists
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/((<li>.*</li>\n?)+)/g, '<ul>$1</ul>');
  
  // Numbered lists
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  
  // Paragraphs
  html = html.replace(/\n\n/g, '</p><p>');
  html = '<p>' + html + '</p>';
  
  // Clean up
  html = html.replace(/<p>(<h[1-6]|<blockquote|<table|<ul|<pre|<hr)/g, '$1');
  html = html.replace(/(<\/h[1-6]>|<\/blockquote>|<\/table>|<\/ul>|<\/pre>|<hr>)<p>/g, '$1');
  html = html.replace(/<p><\/p>/g, '');
  html = html.replace(/<li>/g, '<li style="list-style:disc">');
  
  return html;
}

function openModal() {
  const overlay = document.getElementById('modalOverlay');
  const modal = document.getElementById('modal');
  overlay.classList.add('active');
  modal.classList.add('active');
  
  // Set calendar to current date's month
  if (currentDate) {
    const { year, month } = formatDate(currentDate);
    calendarYear = year;
    calendarMonth = month;
  }
  renderCalendar();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  document.getElementById('modal').classList.remove('active');
}

function renderCalendar() {
  const grid = document.getElementById('calendarGrid');
  const label = document.getElementById('calMonthLabel');
  
  label.textContent = `${calendarYear}年${monthNames[calendarMonth-1]}`;
  grid.innerHTML = '';
  
  const today = new Date();
  const todayStr = getDateString(today.getFullYear(), today.getMonth() + 1, today.getDate());
  
  const daysInMonth = new Date(calendarYear, calendarMonth, 0).getDate();
  const firstDay = new Date(calendarYear, calendarMonth - 1, 1).getDay();
  const prevMonthDays = new Date(calendarYear, calendarMonth - 1, 0).getDate();
  
  // Previous month days
  for (let i = firstDay - 1; i >= 0; i--) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell other-month';
    cell.textContent = prevMonthDays - i;
    grid.appendChild(cell);
  }
  
  // Current month days
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = getDateString(calendarYear, calendarMonth, day);
    const cell = document.createElement('div');
    cell.className = 'cal-cell';
    
    if (dateMap.has(dateStr)) cell.classList.add('has-reflection');
    if (dateStr === todayStr) cell.classList.add('today');
    if (dateStr === currentDate) cell.classList.add('active');
    
    cell.textContent = day;
    cell.onclick = () => {
      currentDate = dateStr;
      updateDisplay();
      closeModal();
    };
    
    grid.appendChild(cell);
  }
  
  // Next month days
  const totalCells = firstDay + daysInMonth;
  const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let i = 1; i <= remaining; i++) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell other-month';
    cell.textContent = i;
    grid.appendChild(cell);
  }
}

function goToToday() {
  const today = new Date();
  const todayStr = getDateString(today.getFullYear(), today.getMonth() + 1, today.getDate());
  
  // Find nearest reflection date
  if (dateMap.has(todayStr)) {
    currentDate = todayStr;
  } else {
    // Find closest past date
    for (let i = reflections.length - 1; i >= 0; i--) {
      if (reflections[i].date <= todayStr) {
        currentDate = reflections[i].date;
        break;
      }
    }
  }
  
  updateDisplay();
  closeModal();
}

// Event listeners
document.getElementById('headerCenter').addEventListener('click', openModal);
document.getElementById('modalOverlay').addEventListener('click', closeModal);

document.getElementById('prevBtn').addEventListener('click', () => {
  const idx = reflections.findIndex(r => r.date === currentDate);
  if (idx > 0) {
    currentDate = reflections[idx - 1].date;
    updateDisplay();
  }
});

document.getElementById('nextBtn').addEventListener('click', () => {
  const idx = reflections.findIndex(r => r.date === currentDate);
  if (idx < reflections.length - 1) {
    currentDate = reflections[idx + 1].date;
    updateDisplay();
  }
});

document.getElementById('calPrevMonth').addEventListener('click', () => {
  calendarMonth--;
  if (calendarMonth < 1) { calendarMonth = 12; calendarYear--; }
  renderCalendar();
});

document.getElementById('calNextMonth').addEventListener('click', () => {
  calendarMonth++;
  if (calendarMonth > 12) { calendarMonth = 1; calendarYear++; }
  renderCalendar();
});

document.getElementById('todayBtn').addEventListener('click', goToToday);

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (document.getElementById('modal').classList.contains('active')) return;
  if (e.key === 'ArrowLeft') {
    document.getElementById('prevBtn').click();
  } else if (e.key === 'ArrowRight') {
    document.getElementById('nextBtn').click();
  }
});

// Touch/swipe navigation
document.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, { passive: true });

document.addEventListener('touchend', (e) => {
  touchEndX = e.changedTouches[0].screenX;
  touchEndY = e.changedTouches[0].screenY;
  handleSwipe();
}, { passive: true });

function handleSwipe() {
  const diffX = touchStartX - touchEndX;
  const diffY = touchStartY - touchEndY;
  
  if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 60) {
    if (diffX > 0) {
      // Swipe left -> next
      document.getElementById('nextBtn').click();
    } else {
      // Swipe right -> prev
      document.getElementById('prevBtn').click();
    }
  }
}

// Initialize
updateDisplay();
</script>
</body>
